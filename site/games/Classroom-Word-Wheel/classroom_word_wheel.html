<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Classroom Word Wheel | TeachersDeck</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
:root{--stage:#0b1430;--panel:#142250;--panel2:#1c2f6b;--gold:#f5c542;--ink:#eef2ff;--muted:#9fb0d8;--ok:#38c172;--bad:#ef5350;--blue:#4da3ff;--pink:#ff6fae;--mint:#3ddbb0;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--stage);color:var(--ink);font-family:'Inter',system-ui,sans-serif}
h1,h2,h3,.disp{font-family:'Baloo 2','Inter',sans-serif;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hdr{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:10px 20px;background:var(--panel);border-bottom:3px solid var(--gold)}
.hdr h1{font-size:1.7rem;color:var(--gold);margin-right:auto}
.lv{display:flex;gap:4px;background:var(--stage);padding:4px;border-radius:999px}
.lv button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-weight:600;color:var(--muted)}
.lv button.on[data-l=easy]{background:var(--ok);color:#06210f}
.lv button.on[data-l=moderate]{background:var(--gold);color:#2a2000}
.lv button.on[data-l=hard]{background:var(--bad);color:#2b0806}
.hbtn{border:2px solid var(--muted);background:transparent;padding:6px 14px;border-radius:999px;text-decoration:none;color:var(--ink);font-weight:600;font-size:.95rem}
.wrap{display:grid;grid-template-columns:1fr 300px;gap:18px;padding:18px 20px;max-width:1500px;margin:0 auto}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}
.stage{background:var(--panel);border-radius:var(--r);padding:22px;min-height:460px}
.btn{border:0;border-radius:12px;padding:12px 22px;font-weight:700;background:var(--gold);color:#2a2000;font-size:1.05rem}
.btn.ghost{background:transparent;border:2px solid var(--muted);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.side{background:var(--panel);border-radius:var(--r);padding:16px;align-self:start}
.side h2{font-size:1.25rem;margin-bottom:10px}
.team{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;background:var(--panel2);border:3px solid transparent;border-radius:12px;padding:10px;margin-bottom:10px;cursor:pointer}
.team.act{border-color:var(--gold)}
.team .nm{font-family:'Baloo 2';font-weight:700;font-size:1.15rem;outline:none;min-width:0}
.team .sc{font-family:'Baloo 2';font-size:2rem;font-weight:800;color:var(--gold);grid-row:span 2}
.team .pm{display:flex;gap:6px}
.team .pm button{border:0;width:34px;height:30px;border-radius:8px;background:var(--stage);font-weight:800}
.side .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.side .row button{flex:1;font-size:.85rem;padding:8px 10px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(30px);background:var(--ink);color:var(--stage);padding:12px 22px;border-radius:999px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:9}
#toast.show{opacity:1;transform:translateX(-50%)}
.ftr{text-align:center;color:var(--muted);font-size:.8rem;padding:14px}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.shake{animation:shake .3s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--muted);font-weight:600}
#turn{font-family:'Baloo 2';font-size:1.4rem;color:var(--ink)}
#vcost{font-family:'Baloo 2';font-size:1.1rem;color:var(--pink)}
#cat{text-align:center;color:var(--gold);font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin:6px 0 10px;min-height:1.4em}
.board{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:14px 28px;min-height:118px;padding:16px;background:var(--stage);border-radius:18px;border:3px solid var(--panel2);margin-bottom:16px;perspective:700px}
.word{display:flex;gap:6px}
.tile{width:clamp(32px,4vw,52px);height:clamp(44px,5.4vw,68px);display:grid;place-items:center;font-family:'Baloo 2';font-weight:800;font-size:clamp(1.4rem,2.9vw,2.3rem);border-radius:8px;background:#eef2ff;color:#0b1430;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15);cursor:pointer;border:0;padding:0}
.tile.hidden{background:linear-gradient(#3a7be0,#1f4fa8);color:transparent;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),0 0 0 2px rgba(255,255,255,.08)}
.tile.static{background:transparent;box-shadow:none;color:var(--ink);cursor:default;width:auto;padding:0 2px}
.play{display:grid;grid-template-columns:minmax(220px,330px) 1fr;gap:22px;align-items:start}
@media(max-width:760px){.play{grid-template-columns:1fr}}
@media(max-width:600px){.board{padding:10px 6px;gap:10px 14px}.word{gap:3px}.tile{width:clamp(22px,7vw,30px);height:clamp(32px,9.5vw,42px);font-size:clamp(1rem,4.6vw,1.3rem);border-radius:6px}}
.wheelbox{position:relative;max-width:330px;margin:0 auto;width:100%;padding-top:10px}
#wheel{width:100%;height:auto;display:block;filter:drop-shadow(0 10px 22px rgba(0,0,0,.45))}
#pointer{position:absolute;left:50%;top:0;width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-top:30px solid var(--gold);transform:translateX(-50%);transform-origin:50% 0;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5));z-index:2}
#result{text-align:center;font-family:'Baloo 2';font-weight:800;font-size:1.7rem;min-height:2.3rem;margin-top:8px}
#result.good{color:var(--gold)}#result.bad{color:var(--bad)}#result.free{color:var(--mint)}
.acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:4px 0 10px}
#hint{color:var(--muted);text-align:center;font-weight:600;margin:2px 0 10px;min-height:1.4em}
.kb{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}
.key{height:46px;border-radius:10px;border:2px solid var(--blue);background:var(--panel2);font-family:'Baloo 2';font-weight:800;font-size:1.3rem;padding:0}
.key.vowel{border-color:var(--pink)}
.key:disabled{opacity:.3;cursor:default}
.key.yes{background:var(--ok);border-color:var(--ok);color:#06210f;opacity:.7}
.key.no{background:#3a2030;border-color:var(--bad);opacity:.45}
#solveRow{display:none;justify-content:center;gap:10px;flex-wrap:wrap;margin:0 0 10px}#solveRow.open{display:flex}
#own{display:none;background:var(--stage);border:2px solid var(--gold);border-radius:14px;padding:14px 16px;margin-bottom:14px}#own.open{display:block}
#own label{display:block;font-weight:600;margin:6px 0 4px;color:var(--muted)}
#own input{width:100%;font:inherit;padding:10px;border-radius:10px;border:2px solid var(--panel2);background:var(--panel);color:var(--ink)}
#msg{text-align:center;font-family:'Baloo 2';font-size:1.4rem;min-height:2rem;margin-top:12px}
</style></head><body>
<div id="td-header"></div>
<div class="wrap">
<main class="stage">
<div class="top"><span id="prog"></span><span id="turn"></span><span id="vcost"></span></div>
<div id="cat"></div>
<div class="board" id="board" aria-live="polite"></div>
<div id="own"><label for="ownPhrase">Your word or phrase</label><input id="ownPhrase" maxlength="60" autocomplete="off" spellcheck="false"><label for="ownCat">Category (optional)</label><input id="ownCat" maxlength="30" autocomplete="off"><div class="acts" style="margin-top:12px"><button class="btn" id="ownGo">Play this phrase</button><button class="btn ghost" id="ownClose">Cancel</button></div></div>
<div class="play">
<div><div class="wheelbox"><div id="pointer"></div><svg id="wheel" viewBox="-112 -112 224 224" role="img" aria-label="The wheel"></svg></div><div id="result" role="status"></div></div>
<div><div class="acts"><button class="btn" id="spin">Spin the wheel</button><button class="btn ghost" id="solve">Solve it</button><button class="btn ghost" id="next">New puzzle</button><button class="btn ghost" id="ownOpen">Own phrase</button></div>
<div id="solveRow"><button class="btn" id="solvedYes">They solved it!</button><button class="btn ghost" id="solvedNo">Not right</button></div>
<div id="hint"></div>
<div class="kb" id="kb" role="group" aria-label="Letters"></div></div>
</div>
<div id="msg" role="status"></div>
</main>
<aside id="td-teams"></aside>
</div>
<div class="ftr">A TeachersDeck game</div>
<div id="toast" role="status"></div>
<script src="classroom_word_wheel.js"></script>
</body></html>
